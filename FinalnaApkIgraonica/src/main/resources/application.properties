# ================================================================
# BLABLA IGRAONICA - GLAVNA PODEŠAVANJA
# Ovaj fajl je prvo mesto koje proveravaš kada menjaš bazu, port, upload ili email.
# Vrednost oblika ${IME:default} znači: koristi environment varijablu IME,
# a ako ona ne postoji koristi vrednost posle dvotačke.
# ================================================================

# --- APLIKACIJA / SERVER ---
spring.application.name=blabla-igraonica
server.port=${PORT:8080}

# --- MYSQL BAZA ---
# CHANGE_ME zameni svojom lokalnom MySQL lozinkom ili još bolje postavi DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/blabla_igraonica?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Europe/Belgrade}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:CHANGE_ME}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate automatski usklađuje tabele sa Java @Entity klasama.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Europe/Belgrade

# Tokom razvoja ostavi false da se HTML promene vide bez restartovanja.
spring.thymeleaf.cache=false

# --- UPLOAD SLIKA ---
# Maksimalna veličina jedne slike i celog multipart zahteva.
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=40MB
# Fizički folder u koji se čuvaju slike galerije.
app.upload-dir=${UPLOAD_DIR:uploads}

# --- POČETNI ADMIN NALOZI ---
# Za produkciju OBAVEZNO promeni demo lozinke ili koristi env varijable.
app.owner.email=${OWNER_EMAIL:owner@blabla.rs}
app.owner.password=${OWNER_PASSWORD:PromeniMe123!}
app.employee.email=${EMPLOYEE_EMAIL:radnik@blabla.rs}
app.employee.password=${EMPLOYEE_PASSWORD:Radnik123!}

# --- EMAIL OBAVEŠTENJA ---
# Dok je MAIL_ENABLED=false, aplikacija neće pokušavati da šalje email.
# Primeri teksta poruka i koraci za kasnije uključivanje su u EMAIL-PRIMER.md.
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:}

# SMTP primer je podešen za Gmail, ali možeš koristiti i drugi provajder.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS_REQUIRED:false}
